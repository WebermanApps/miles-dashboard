<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miles Deck</title><link rel="stylesheet" href="../brand-tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600&family=Khand:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FDFBF6;color:var(--mw-foreground,#222);font-family:Hind,system-ui,sans-serif}
.w{max-width:640px;margin:0 auto;padding:12px 16px 40px}
h1,h2{font-family:Khand,sans-serif;font-weight:700;margin:.2em 0}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
a.back,button{min-height:44px;font:600 1rem Hind,sans-serif;border-radius:10px;border:1px solid #d9d2c3;background:#fff;color:inherit;padding:0 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.card{background:#fff;border:1px solid #e6dfcf;border-left:4px solid #1F7A7A;border-radius:14px;padding:16px;margin:12px 0}
.cat{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:#1F7A7A;font-weight:600}
.opts{display:grid;gap:8px;margin:12px 0}.opts button{justify-content:flex-start;text-align:left}
.opts button.on{border-color:#1F7A7A;background:#E8F3F1}
textarea{width:100%;box-sizing:border-box;min-height:60px;font:1rem Hind,sans-serif;border:1px solid #d9d2c3;border-radius:10px;padding:8px}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:10px}
.prog{color:#777;font-size:.9rem}#submitBox{margin:16px 0}
footer{text-align:center;color:#777;margin-top:24px}footer a{color:inherit}
</style></head><body><div class="w">
<div class="top"><a class="back" href="../">Back to Deck Building</a><span class="prog" id="prog"></span></div>
<h1 id="title">Deck</h1>
<div id="submitBox"></div>
<div id="card"></div>
<footer>Built by <a href="https://maxweberman.com">Max Weberman</a></footer>
</div>
<script src="https://webermanapps.github.io/style-swipe/submit.js"></script>
<script>
const P=new URLSearchParams(location.search),ID=(P.get('d')||'miles-q1').replace(/[^a-z0-9-]/g,''),K='miles-deck-'+ID;
let D,st=JSON.parse(localStorage.getItem(K)||'{"a":{},"n":{},"s":{},"i":0}'),i=0;
const save=()=>localStorage.setItem(K,JSON.stringify(st)),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CL={card:'New Card Priorities',points:'Points & Redemptions',travel:'Travel Goals',dash:'Dashboard Deck'};
function results(){const answered=Object.keys(st.a).length;return{deck:ID,answers:st.a,notes:st.n,skipped:Object.keys(st.s),unanswered:D.cards.filter(c=>!st.a[c.id]&&!st.n[c.id]).map(c=>c.id),answered,total:D.cards.length,test:P.has('test')}}
function draw(){const c=D.cards[i];document.getElementById('prog').textContent=`Card ${i+1} of ${D.cards.length} · ${Object.keys(st.a).length} answered`;
 document.getElementById('card').innerHTML=`<div class="card"><div class="cat">${esc(CL[c.cat]||c.cat)}</div><h2>${esc(c.q)}</h2><div class="opts">${c.options.map((o,j)=>`<button data-o="${j}" class="${st.a[c.id]===o?'on':''}">${esc(o)}</button>`).join('')}</div>
 <textarea id="note" placeholder="Notes (optional)">${esc(st.n[c.id]||'')}</textarea><div class="nav"><button id="prev">Back</button><button id="skip">Skip</button><button id="next">Next</button></div></div>`;
 document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{st.a[c.id]=c.options[b.dataset.o];delete st.s[c.id];save();go(1)});
 const n=document.getElementById('note');n.oninput=()=>{n.value.trim()?st.n[c.id]=n.value:delete st.n[c.id];save()};
 document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);
 document.getElementById('skip').onclick=()=>{if(!st.a[c.id])st.s[c.id]=1;save();go(1)}}
function go(d){i=(i+d+D.cards.length)%D.cards.length;st.i=i;save();draw()}
fetch(ID+'.json?v='+Date.now()).then(r=>r.json()).then(j=>{D=j;document.getElementById('title').textContent=D.name;i=Math.min(st.i||0,D.cards.length-1);draw();
 MWSubmit.button(document.getElementById('submitBox'),{agent:'miles',app:'miles-deck',deck:ID+(P.has('test')?'-test':''),getResults:results,getNotes:()=>Object.entries(st.n).map(([k,v])=>k+': '+v).join('\n')})});
</script></body></html>
