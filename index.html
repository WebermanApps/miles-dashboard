<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light only">
<title>Miles Agent · Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Khand:wght@700&family=Hind:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand-tokens.css">
<style>
*{box-sizing:border-box}html{color-scheme:light}
body{margin:0;background:#FBF8F2;color:var(--mw-foreground);font-family:var(--mw-font-body);font-size:1rem;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 0}
h1,h2,h3{font-family:var(--mw-font-heading);font-weight:700;line-height:1.1;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(2.3rem,7vw,3.6rem)}@media(min-width:1700px){h1{font-size:4rem}}h2{font-size:1.5rem;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.wm{font-family:var(--mw-font-heading);letter-spacing:var(--mw-tracking-label);font-size:.85rem;color:var(--mw-muted-text);text-transform:uppercase}
.role{color:var(--mw-muted-text);margin:4px 0 14px}
.status{background:#fff;border:1px solid var(--mw-border);border-left:3px solid #B8742A;border-radius:12px;padding:14px 16px}
.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:var(--mw-tracking-label);color:var(--mw-muted-text);font-weight:600}
.grid{display:grid;gap:18px;margin-top:22px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}.span{grid-column:1/-1}}
@media(min-width:1200px){.wrap{padding-top:44px}}
section.card{background:#fff;border:1px solid var(--mw-border);border-radius:14px;padding:1.15rem}
.apps{display:grid;gap:12px}@media(min-width:760px){.apps{grid-template-columns:1fr 1fr}}
a.app{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:4rem;padding:.9rem 1rem;border:1px solid var(--mw-border);border-radius:12px;text-decoration:none;color:inherit;background:#fff}
a.app b{font-family:var(--mw-font-heading);font-size:1.25rem;display:block}a.app span{color:var(--mw-muted-text);font-size:.92rem}
a.app svg{flex:none;transition:transform var(--mw-dur) var(--mw-ease)}a.app:hover svg{transform:translateX(3px)}
ul{list-style:none;margin:0;padding:0}li.item.r{display:flex;gap:.6em}li.item{padding:12px 0;border-top:1px solid var(--mw-border)}li.item:first-child{border-top:0;padding-top:0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.t{font-weight:600}.d{color:var(--mw-muted-text);font-size:.94rem}
.pill{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--mw-border);border-radius:999px;padding:2px 9px;white-space:nowrap;color:#525252}
.p1{border-color:#B8742A;color:#8a5418;font-weight:600;margin-right:6px}
ol{margin:0;padding-left:22px}ol li{padding:6px 0}
.date{font-family:var(--mw-font-heading);color:var(--mw-muted-text);min-width:4.5em;display:inline-block}
.ic{width:1.25rem;height:1.25rem;stroke:#B8742A;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.share{display:flex;justify-content:center;margin:34px 0 10px}
button.btn{font:600 .85rem var(--mw-font-body);text-transform:uppercase;letter-spacing:var(--mw-tracking-label);border:2px solid var(--mw-primary);background:transparent;color:var(--mw-primary);padding:14px 32px;min-height:48px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
button.btn:hover{background:var(--mw-primary);color:var(--mw-primary-foreground)}button.btn:hover .ic{stroke:currentColor}
footer{text-align:center;padding:18px 0 34px;color:var(--mw-muted-text);font-size:.9rem;border-top:1px solid var(--mw-border);margin-top:16px}
footer a{color:var(--mw-foreground);text-decoration:none;border-bottom:1px solid rgba(10,10,10,.3)}footer a:hover{border-color:var(--mw-foreground)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;border:1px solid var(--mw-border);padding:8px 14px;border-radius:10px;display:none}
.ubar{background:#fff;border-bottom:1px solid var(--mw-border);border-top:3px solid #B8742A}
.ubin{max-width:1100px;margin:0 auto;padding:14px 18px}
.uhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:6px}
.utitle{font-family:var(--mw-font-heading);font-weight:700;font-size:1.3rem}.uts{color:var(--mw-muted-text);font-size:.85rem}
.ulines{display:grid;gap:8px}@media(min-width:760px){.ulines{grid-template-columns:repeat(2,1fr)}}
.ug{font-size:.95rem}.ug .lbl{display:block}.ug p{margin:0}
@media(min-width:1700px){html{font-size:18px}.wrap,.ubin{max-width:1500px}.grid{grid-template-columns:repeat(3,1fr)}.ulines{grid-template-columns:repeat(auto-fit,minmax(14em,1fr))}.grid .recent{grid-column:auto}}
@media(min-width:1900px){html{font-size:21px}}@media(min-width:2400px){html{font-size:24px}.wrap,.ubin{max-width:1900px}}
@media(min-width:3200px){html{font-size:36px}.wrap,.ubin{max-width:2600px}}
a:focus-visible,button:focus-visible{outline:3px solid #B8742A;outline-offset:3px}
@media(min-width:1900px){.wrap,.ubin{padding-left:5vw;padding-right:5vw}.wrap{padding-top:5vh}footer{padding-bottom:5vh}}
@media(min-width:1280px) and (max-width:1699px){.wrap,.ubin{max-width:1300px}.grid{grid-template-columns:repeat(3,1fr)}.grid .recent{grid-column:auto}.ulines{grid-template-columns:repeat(3,1fr)}}
.alerts{background:#fff;border:1px solid var(--mw-border);border-radius:12px;margin:0 0 12px}
.alerts summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:600;list-style:none}
.alerts summary::-webkit-details-marker{display:none}.alerts summary:before{content:"";width:8px;height:8px;border-right:2px solid #737373;border-bottom:2px solid #737373;transform:rotate(-45deg);transition:transform var(--mw-dur)}
.alerts[open] summary:before{transform:rotate(45deg)}.alerts ul{padding:0 14px 12px}.alerts li{padding:6px 0;border-top:1px solid var(--mw-border)}
.lv{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin-right:8px;font-weight:600}.lv.urgent{color:#b42318}.lv.warning{color:#8a5418}
.topnav{background:#fff;border-bottom:1px solid var(--mw-border)}.topnav .tn{max-width:1100px;margin:0 auto;padding:0 18px}.topnav .homelink{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;color:var(--mw-foreground);text-decoration:none;font-weight:600;font-size:.85rem;text-transform:uppercase;letter-spacing:var(--mw-tracking-label)}
.topnav .homelink:hover{text-decoration:underline}
@media(min-width:1280px) and (max-width:1699px){.topnav .tn{max-width:1300px}}@media(min-width:1700px){.topnav .tn{max-width:1500px}}@media(min-width:1900px){.topnav .tn{padding:0 5vw}}@media(min-width:2400px){.topnav .tn{max-width:1900px}}@media(min-width:3200px){.topnav .tn{max-width:2600px}}

/* Max's settled dashboard picks (Oct 13 23:06): spaced-caps compact Apps Home link, big-title Fresh Start bar with fold-out sections and numbered rows (saffron), two-up color-edge open-item cards with square corners, Waiting On Max tinted color-band header with side-rule rows, pill status chips */
.topnav .homelink{color:#1F7A7A;letter-spacing:.16em;font-size:.78rem}
.utitle{font-size:clamp(1.6rem,5vw,2.2rem)}
.ulines{display:grid;gap:10px;align-items:start}
.ufold{border:1px solid var(--mw-border);border-radius:12px;background:#fff}
.ufold summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:#525252;list-style:none}
.ufold summary::-webkit-details-marker{display:none}
.ufold summary:before{content:"";width:7px;height:7px;border-right:2px solid #737373;border-bottom:2px solid #737373;transform:rotate(-45deg);transition:transform var(--mw-dur)}
.ufold[open] summary:before{transform:rotate(45deg)}
.ucount{margin-left:auto;font-size:.72rem;color:#8a6a10;background:#FBF1D6;border-radius:999px;padding:1px 8px}
.unum{counter-reset:n;list-style:none;margin:0;padding:0 14px 12px}
.unum li{counter-increment:n;display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--mw-border);font-size:.95rem}
.unum li:first-child{border-top:0}
.unum li:before{content:counter(n);flex:none;width:1.6em;height:1.6em;border-radius:50%;background:#FBF1D6;color:#8a6a10;font:700 .8rem var(--mw-font-heading);display:flex;align-items:center;justify-content:center;margin-top:.1em}
ul.two{display:grid;gap:12px}@media(min-width:640px){ul.two{grid-template-columns:1fr 1fr}}
ul.two li.item.edge{border:1px solid var(--mw-border);border-left:4px solid #B8742A;border-radius:0;padding:14px 16px;background:#fff}
ul.two li.item.edge:first-child{padding-top:14px}
li.edge.e-max{border-left-color:#B8742A}li.edge.e-watch{border-left-color:#1F7A7A}li.edge.e-prog{border-left-color:#525252}
.dcard{padding-top:0;overflow:hidden}
.dcard h2.band{margin:0 -1.15rem 14px;padding:12px 1.15rem;background:#FBF1D6;border-bottom:1px solid #F0E2B8;font-size:1.05rem;text-transform:uppercase;letter-spacing:.14em}
ol.siderule{list-style:none;padding:0;counter-reset:d}
ol.siderule li{border-left:3px solid #B8742A;padding:6px 0 6px 12px;margin:0 0 10px}
.pill{border-radius:999px}
@media(min-width:1280px){.grid .recent{grid-column:span 2}}
</style><script src="ptr.js" defer></script>
</head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
<symbol id="i-q" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></symbol>
</defs></svg>
<nav class="topnav"><div class="tn"><a class="homelink" href="https://webermanapps.github.io/a-2sipntzsp385oxy3/"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Apps Home</a></div></nav>
<div class="ubar" id="ubar"><div class="ubin"><div class="uhead"><span class="utitle" id="utitle"></span><span class="uts" id="uts"></span></div><div class="ulines" id="ulines"></div></div></div>
<div class="wrap">
<div class="wm">Max Weberman · Command Center</div>
<h1 id="agent"></h1><div class="role" id="role"></div>
<details class="alerts" id="alerts" hidden><summary id="asum"></summary><ul id="alist"></ul></details>
<div class="status"><div class="lbl">Current Status · Updated <span id="upd"></span></div><div id="status"></div></div>
<div class="grid">
<section class="card span"><h2><svg class="ic"><use href="#i-grid"/></svg>Apps</h2><div class="apps" id="apps"></div></section>
<section class="card span"><h2><svg class="ic"><use href="#i-list"/></svg>Open Items</h2><ul id="open" class="two"></ul></section>
<section class="card dcard"><h2 class="band"><svg class="ic"><use href="#i-q"/></svg>Waiting On Max</h2><ol id="dec" class="siderule"></ol>
<h2 style="margin-top:22px"><svg class="ic"><use href="#i-clock"/></svg>Routines</h2><ul id="rout"></ul></section>
<section class="card span recent"><h2><svg class="ic"><use href="#i-check"/></svg>Recent Work</h2><ul id="recent"></ul></section>
</div>
<div class="share"><button class="btn mw-hover" id="share"><svg class="ic"><use href="#i-share"/></svg>Share</button></div>
<footer>Built by <a class="mw-hover" href="https://maxweberman.com" target="_blank" rel="noopener">Max Weberman</a></footer>
</div><div id="toast">Link copied</div>
<script src="data.js"></script>
<script>
const D=window.DASH,$=id=>document.getElementById(id),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=D.report;if(R&&R.lines&&R.lines.length){$('utitle').textContent=R.title||'Update';$('uts').textContent=R.timestamp||'';
$('ulines').innerHTML=R.lines.map((g,gi)=>{if(typeof g==='string')g={category:'',lines:[g]};const rows=(g.lines||[]).map(l=>`<li>${e(l)}</li>`).join('');return g.category?`<details class="ufold"${gi===0?' open':''}><summary>${e(g.category)}<span class="ucount">${(g.lines||[]).length}</span></summary><ol class="unum">${rows}</ol></details>`:`<ol class="unum">${rows}</ol>`}).join('')}else $('ubar').style.display='none';
{const A=D.alerts||[];if(A.length){const u=A.filter(a=>a.level==='urgent').length,w=A.length-u;$('asum').textContent=[u?u+' Urgent':'',w?w+(w>1?' Warnings':' Warning'):''].filter(Boolean).join(' · ');
$('alist').innerHTML=A.map(a=>`<li><span class="lv ${a.level==='urgent'?'urgent':'warning'}">${a.level==='urgent'?'Urgent':'Warning'}</span>${e(a.text)}</li>`).join('');$('alerts').hidden=false}}
$('agent').textContent=D.agent;$('role').textContent=D.role;$('upd').textContent=D.updated;$('status').textContent=D.status;
$('apps').innerHTML=D.apps.map(a=>`<a class="app mw-hover" href="${e(a.url)}" target="_blank" rel="noopener"><div><b>${e(a.name)}</b><span>${e(a.note||'')}</span></div><svg class="ic"><use href="#i-arrow"/></svg></a>`).join('');
$('open').innerHTML=D.openItems.map(i=>`<li class="item edge ${/watch/i.test(i.state)?'e-watch':/max/i.test(i.state)?'e-max':'e-prog'}"><div class="row"><div class="t">${i.pri?`<span class="pill p1">${e(i.pri)}</span>`:''}${e(i.title)}</div><span class="pill">${e(i.state)}</span></div><div class="d">${e(i.detail)}</div></li>`).join('');
$('dec').innerHTML=D.decisions.map(d=>`<li>${e(d)}</li>`).join('');
$('rout').innerHTML=D.routines.map(r=>`<li class="item"><div class="t">${e(r.name)}</div><div class="d">${e(r.when)}</div></li>`).join('');
$('recent').innerHTML=D.recent.map(r=>`<li class="item r"><span class="date">${e(r.date)}</span>${e(r.text)}</li>`).join('');
$('share').onclick=async()=>{const u=location.href;try{if(navigator.share){await navigator.share({title:document.title,url:u});return}}catch(x){return}
try{await navigator.clipboard.writeText(u)}catch(x){}const t=$('toast');t.style.display='block';setTimeout(()=>t.style.display='none',1600)};
</script></body></html>
